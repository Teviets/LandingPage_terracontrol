services:
  db:
    image: postgres:16-alpine
    container_name: terracontrol-db
    environment:
      POSTGRES_USER: ${DB_USER:-terra}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-terra}
      POSTGRES_DB: ${DB_NAME:-terracontrol}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-terra} -d ${DB_NAME:-terracontrol}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - terracontrol-network
    restart: unless-stopped

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: terracontrol-api
    environment:
      DATABASE_URL: postgresql://${DB_USER:-terra}:${DB_PASSWORD:-terra}@db:5432/${DB_NAME:-terracontrol}?schema=public
      PORT: ${API_PORT:-5174}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost,http://127.0.0.1,http://terracontrolgt.com,http://www.terracontrolgt.com}
      NODE_ENV: ${NODE_ENV:-production}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - terracontrol-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${API_PORT:-5174}/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s

  nginx:
    build:
      context: ./landing
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
    container_name: terracontrol-nginx
    ports:
      - "80:80"
      - "443:443"
    environment:
      SERVER_NAMES: ${SERVER_NAMES:-terracontrolgt.com www.terracontrolgt.com _}
      API_PROXY_PASS: ${API_PROXY_PASS:-http://api:5174/api/}
      SSL_CERT_PATH: ${SSL_CERT_PATH:-/etc/letsencrypt/live/terracontrolgt.com/fullchain.pem}
      SSL_KEY_PATH: ${SSL_KEY_PATH:-/etc/letsencrypt/live/terracontrolgt.com/privkey.pem}
      ACME_CHALLENGE_ROOT: /var/www/certbot
      SSL_WATCH_INTERVAL: ${SSL_WATCH_INTERVAL:-300}
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    networks:
      - terracontrol-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  certbot:
    image: certbot/certbot:latest
    container_name: terracontrol-certbot
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        if [ -z "$$CERTBOT_EMAIL" ]; then
          echo "CERTBOT_EMAIL is not set. Skipping automatic certificate issuance and renewal."
          while true; do sleep 3600; done
        fi

        staging_args=""
        if [ "$$CERTBOT_STAGING" = "1" ]; then
          staging_args="--staging"
        fi

        while true; do
          extra_domains=$$(printf '%s' "$$CERTBOT_DOMAINS" | tr ',' '\n' | sed '/^$$/d;1d;s/^/-d /' | tr '\n' ' ')

          if certbot certonly --webroot -w /var/www/certbot \
            $$staging_args \
            --email "$$CERTBOT_EMAIL" \
            --agree-tos \
            --no-eff-email \
            --keep-until-expiring \
            -d "$$CERTBOT_PRIMARY_DOMAIN" \
            $$extra_domains; then
            certbot renew --webroot -w /var/www/certbot $$staging_args || true
            sleep "$$CERTBOT_RENEW_INTERVAL"
          else
            echo "Certificate issuance failed. Retrying in 5 minutes."
            sleep 300
          fi
        done
    environment:
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:-}
      CERTBOT_DOMAINS: ${CERTBOT_DOMAINS:-terracontrolgt.com,www.terracontrolgt.com}
      CERTBOT_PRIMARY_DOMAIN: ${CERTBOT_PRIMARY_DOMAIN:-terracontrolgt.com}
      CERTBOT_STAGING: ${CERTBOT_STAGING:-0}
      CERTBOT_RENEW_INTERVAL: ${CERTBOT_RENEW_INTERVAL:-12h}
    depends_on:
      nginx:
        condition: service_started
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot

volumes:
  postgres-data:
    driver: local
  letsencrypt:
    driver: local
  certbot-www:
    driver: local

networks:
  terracontrol-network:
    driver: bridge
